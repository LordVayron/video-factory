name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and numpy (the launch film checks find green screens with numpy)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install numpy
      - run: npm ci
      - name: Offline checks (no keys, no paid calls)
        run: npm test
