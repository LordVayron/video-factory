name: Feature request
description: A new format, model, safeguard or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to make, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it would work from the creator's side. Example videos or links help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new video format
        - A new image or video model
        - Writing (scripts, story)
        - Editing, captions, sound
        - Cost and budget
        - Installation and setup
        - Something else
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
